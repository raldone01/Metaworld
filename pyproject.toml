# Package ######################################################################
[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metaworld"
version = "3.0.0"
description = "Collections of robotics environments geared towards benchmarking multi-task and meta reinforcement learning."
readme = "README.md"
requires-python = ">= 3.10"
authors = [{ name = "Farama Foundation", email = "contact@farama.org" }]
license = { text = "MIT License" }
keywords = ["Reinforcement Learning", "game", "RL", "AI", "gymnasium"]
classifiers = [
    "Development Status :: 4 - Beta",                             # change to `5 - Production/Stable` when ready
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
dependencies = [
    "gymnasium>=1.1",
    "mujoco>=3.0.0",
    "numpy>=1.18",
    "scipy>=1.4.1",
    "imageio",
]

[dependency-groups]
dev = ["ruff>=0.14.14", "ty>=0.0.14"]
coverage = ["pytest-cov"]
benchmarking = ["pyinstrument"]
testing = [
    "ipdb",
    "memory_profiler",
    "pyquaternion==0.9.5",
    "pytest>=4.4.0",
    "pytest-xdist",
]

[project.urls]
Homepage = "https://farama.org"
Repository = "https://github.com/Farama-Foundation/Metaworld"
Documentation = "https://metaworld.github.io/"
"Bug Report" = "https://github.com/Farama-Foundation/Metaworld/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
metaworld = ["py.typed"]

[tool.setuptools.packages.find]
include = ["metaworld", "metaworld.*"]

[tool.uv]
# By default, install all dependency groups
default-groups = "all"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
    "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
    "T100", # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T2",   # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TD",   # https://docs.astral.sh/ruff/rules/#flake8-todos-td
    "UP",   # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "I",    # https://docs.astral.sh/ruff/rules/#isort-i
    "N",    # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "D",    # https://docs.astral.sh/ruff/rules/#pydocstyle-d
]
